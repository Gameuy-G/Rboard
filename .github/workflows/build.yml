name: Build Rasi Keyboard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: true

      - name: Apply Rasi patch
        run: git apply --whitespace=nowarn rasi.patch

      - name: Force Rboard app names (permanent, survives any patch problem)
        run: |
          for D in java/res java/unstable/res; do
            mkdir -p "$D/values"
            cat > "$D/values/strings-appname.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="english_ime_name">Rboard</string>
              <string name="spell_checker_service_name">Rboard Spell Checker</string>
              <string name="english_ime_settings">Rasi Keyboard Settings</string>
              <string name="android_spell_checker_settings">Rboard Spell Checker Settings</string>
          </resources>
          XMLEOF
          done
          grep -H "english_ime" java/res/values/strings-appname.xml java/unstable/res/values/strings-appname.xml
          if grep -q "FUTO" java/res/values/strings-appname.xml java/unstable/res/values/strings-appname.xml; then echo "FUTO name found"; exit 1; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and CMake
        run: |
          SDKM=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f | head -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build
        run: ./gradlew assembleUnstableDebug --no-daemon

      - name: Publish APK to Releases (no zip, direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find . -name "*.apk" -not -path "*/intermediates/*" | head -1)
          echo "Found: $APK"
          if [ -z "$APK" ]; then
            echo "No APK found. All apk files:"
            find . -name "*.apk" | head -20
            exit 1
          fi
          ls -lh "$APK"
          cp "$APK" rasi-keyboard.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest rasi-keyboard.apk --title "Rasi Keyboard" --notes "Free, modified copy of FUTO Keyboard. See RASI-MODIFIED.md"

      - name: Instant update alert
        if: success()
        run: |
          curl -s -H "Title: Rboard updated" -H "Tags: update" -H "Click: https://github.com/Gameuy-G/Rboard/releases/download/latest/rasi-keyboard.apk" -d "A new version is ready. Tap to download." https://ntfy.sh/rboard-9cfbacd2ea78769856b0 || true
